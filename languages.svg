<svg xmlns="http://www.w3.org/2000/svg" width="350" height="230" viewBox="0 0 350 230" fill="none">
  <rect x="0.5" y="0.5" width="349" height="229" rx="4.5" fill="#0d1117" stroke="#30363d"/>
  <text x="25" y="35" fill="#58a6ff" font-family="Segoe UI, Ubuntu, Helvetica Neue, Sans-Serif" font-weight="bold" font-size="18">Most Used Languages</text>

  <!-- Progress bar background -->
  <rect x="25" y="55" width="300" height="8" rx="4" fill="#30363d"/>
  <!-- Go: 32% -->
  <rect x="25" y="55" width="96" height="8" rx="4" fill="#00ADD8"/>
  <!-- TypeScript: 24% -->
  <rect x="121" y="55" width="72" height="8" fill="#3178C6"/>
  <!-- Python: 18% -->
  <rect x="193" y="55" width="54" height="8" fill="#3572A5"/>
  <!-- Rust: 12% -->
  <rect x="247" y="55" width="36" height="8" fill="#DEA584"/>
  <!-- Java: 8% -->
  <rect x="283" y="55" width="24" height="8" fill="#B07219"/>
  <!-- C++: 4% -->
  <rect x="307" y="55" width="12" height="8" fill="#F34B7D"/>
  <!-- Other: 2% -->
  <rect x="319" y="55" width="6" height="8" rx="0 4 4 0" fill="#8b949e"/>

  <!-- Legend row 1 -->
  <g transform="translate(25, 90)">
    <circle cx="6" cy="6" r="6" fill="#00ADD8"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Go</text>
    <text x="40" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">32.14%</text>
  </g>
  <g transform="translate(175, 90)">
    <circle cx="6" cy="6" r="6" fill="#3178C6"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">TypeScript</text>
    <text x="95" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">24.37%</text>
  </g>

  <!-- Legend row 2 -->
  <g transform="translate(25, 120)">
    <circle cx="6" cy="6" r="6" fill="#3572A5"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Python</text>
    <text x="65" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">17.82%</text>
  </g>
  <g transform="translate(175, 120)">
    <circle cx="6" cy="6" r="6" fill="#DEA584"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Rust</text>
    <text x="50" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">11.95%</text>
  </g>

  <!-- Legend row 3 -->
  <g transform="translate(25, 150)">
    <circle cx="6" cy="6" r="6" fill="#B07219"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Java</text>
    <text x="50" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">7.64%</text>
  </g>
  <g transform="translate(175, 150)">
    <circle cx="6" cy="6" r="6" fill="#F34B7D"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">C++</text>
    <text x="45" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">4.21%</text>
  </g>

  <!-- Legend row 4 -->
  <g transform="translate(25, 180)">
    <circle cx="6" cy="6" r="6" fill="#8b949e"/>
    <text x="18" y="11" fill="#c9d1d9" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Other</text>
    <text x="55" y="11" fill="#8b949e" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">1.87%</text>
